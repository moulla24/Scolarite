spring:
  application:
    name: ecoli-backend
  config:
    # Fichier local non versionné (copier application-local.yml.example)
    import: optional:classpath:application-local.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecoli}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:8081}
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

ecoli:
  cors:
    # Flutter Web utilise un port aléatoire (ex. 50886) — patterns requis en dev
    allowed-origin-patterns: ${ECOLI_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  jwt:
    secret: ${ECOLI_JWT_SECRET:ecoli-jwt-secret-key-minimum-32-characters-long}
    expiration-ms: ${ECOLI_JWT_EXPIRATION_MS:86400000}
  upload:
    dir: ${ECOLI_UPLOAD_DIR:uploads}
  paiement:
    simulation-delai-secondes: 30

logging:
  level:
    mr.ecoli: INFO
