server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

ecoli:
  cors:
    allowed-origin-patterns: ${ECOLI_CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${ECOLI_JWT_SECRET}
    expiration-ms: ${ECOLI_JWT_EXPIRATION_MS:86400000}
  upload:
    dir: ${ECOLI_UPLOAD_DIR:/tmp/uploads}

logging:
  level:
    mr.ecoli: INFO
