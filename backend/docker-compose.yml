services:
  postgres:
    image: postgres:16-alpine
    container_name: ecoli-postgres
    environment:
      POSTGRES_DB: ecoli
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ecoli_pg_data:/var/lib/postgresql/data

volumes:
  ecoli_pg_data:
