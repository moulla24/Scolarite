@if (loading()) {
  <p class="detail-loading">Chargement des chapitres…</p>
} @else if (detail()) {
  <section class="detail-panel">
    <header class="detail-panel__header">
      <div>
        <h2 class="detail-panel__title">{{ detail()!.matiere }}</h2>
        <p class="detail-panel__meta">{{ detail()!.classe }} · {{ detail()!.niveau }}</p>
      </div>
      <button type="button" class="btn btn--ghost btn--sm" (click)="closed.emit()">
        <span class="material-symbols-outlined" aria-hidden="true">close</span>
        Fermer
      </button>
    </header>

    <div class="detail-panel__vh">
      <label class="detail-panel__label" for="mq-vh">Volume horaire (h/sem)</label>
      <input
        id="mq-vh"
        type="text"
        class="detail-panel__input"
        inputmode="decimal"
        [ngModel]="volumeHoraire()"
        (ngModelChange)="volumeHoraire.set($event)"
      />
    </div>

    <div class="detail-panel__chapters">
      <div class="detail-panel__chapters-head">
        <h3>Chapitres</h3>
        <button type="button" class="btn btn--outline btn--sm" (click)="addChapitre()">
          <span class="material-symbols-outlined" aria-hidden="true">add</span>
          Ajouter
        </button>
      </div>

      @for (ch of chapitres(); track $index; let i = $index) {
        <div class="chapter-row">
          <input
            type="text"
            class="chapter-row__ordre"
            [ngModel]="ch.ordre"
            (ngModelChange)="patchChapitre(i, 'ordre', $event)"
            aria-label="Ordre chapitre"
          />
          <input
            type="text"
            class="chapter-row__titre"
            placeholder="Titre du chapitre"
            [ngModel]="ch.titre"
            (ngModelChange)="patchChapitre(i, 'titre', $event)"
          />
          <input
            type="text"
            class="chapter-row__desc"
            placeholder="Description (optionnel)"
            [ngModel]="ch.description"
            (ngModelChange)="patchChapitre(i, 'description', $event)"
          />
          <button type="button" class="chapter-row__remove" (click)="removeChapitre(i)" title="Supprimer">
            <span class="material-symbols-outlined" aria-hidden="true">delete</span>
          </button>
        </div>
      }
    </div>

    <div class="page-save-bar">
      <button type="button" class="btn btn--primary" [disabled]="saving()" (click)="onSave()">
        <span class="material-symbols-outlined" aria-hidden="true">save</span>
        {{ saving() ? 'Enregistrement…' : 'Enregistrer' }}
      </button>
    </div>
  </section>
}
