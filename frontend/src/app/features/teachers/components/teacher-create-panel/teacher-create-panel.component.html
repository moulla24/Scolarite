<section class="create-panel" aria-labelledby="create-teacher-title">
  <header class="create-panel__header">
    <div class="create-panel__title-row">
      <span class="material-symbols-outlined create-panel__icon" aria-hidden="true">person_add</span>
      <div>
        <h2 id="create-teacher-title" class="create-panel__title">
          {{ isEditMode() ? 'Modifier l’enseignant' : 'Nouvel enseignant' }}
        </h2>
        <p class="create-panel__subtitle">
          {{ isEditMode() ? 'Mettez à jour les informations de l’enseignant' : 'Renseignez les informations du corps enseignant' }}
        </p>
      </div>
    </div>
    <button
      type="button"
      class="create-panel__close"
      aria-label="Fermer le formulaire"
      (click)="onCancel()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">close</span>
    </button>
  </header>

  @if (loading()) {
    <p class="create-panel__subtitle">Chargement…</p>
  }

  @if (errorMessage(); as err) {
    <div class="create-panel__alert" role="alert">{{ err }}</div>
  }

  <form class="create-panel__form" (ngSubmit)="onSubmit()">
    <div class="create-panel__grid">
      <div class="form-field">
        <label class="form-field__label" for="tch-nom">Nom *</label>
        <input
          id="tch-nom"
          class="form-field__input"
          type="text"
          [ngModel]="form().nom"
          (ngModelChange)="patchField('nom', $event)"
          name="nom"
          required
        />
      </div>

      <div class="form-field">
        <label class="form-field__label" for="tch-prenom">Prénom *</label>
        <input
          id="tch-prenom"
          class="form-field__input"
          type="text"
          [ngModel]="form().prenom"
          (ngModelChange)="patchField('prenom', $event)"
          name="prenom"
          required
        />
      </div>

      <div class="form-field">
        <label class="form-field__label" for="tch-email">E-mail *</label>
        <input
          id="tch-email"
          class="form-field__input"
          type="email"
          [ngModel]="form().email"
          (ngModelChange)="patchField('email', $event)"
          name="email"
          required
        />
      </div>

      <div class="form-field">
        <label class="form-field__label" for="tch-tel">Téléphone</label>
        <input
          id="tch-tel"
          class="form-field__input"
          type="tel"
          placeholder="+222 45 12 34 56"
          [ngModel]="form().telephone"
          (ngModelChange)="patchField('telephone', $event)"
          name="telephone"
        />
      </div>

      <div class="form-field">
        <label class="form-field__label" for="tch-spec">Spécialité</label>
        <input
          id="tch-spec"
          class="form-field__input"
          type="text"
          placeholder="Mathématiques"
          [ngModel]="form().specialite"
          (ngModelChange)="patchField('specialite', $event)"
          name="specialite"
        />
      </div>

      <div class="form-field">
        <label class="form-field__label" for="tch-embauche">Date d’embauche</label>
        <input
          id="tch-embauche"
          class="form-field__input"
          type="date"
          [ngModel]="form().dateEmbauche"
          (ngModelChange)="patchField('dateEmbauche', $event)"
          name="dateEmbauche"
        />
      </div>

      <div class="form-field">
        <label class="form-field__label" for="tch-actif">Statut</label>
        <select
          id="tch-actif"
          class="form-field__input"
          [ngModel]="form().actif"
          (ngModelChange)="patchField('actif', $event)"
          name="actif"
        >
          <option [ngValue]="true">Actif</option>
          <option [ngValue]="false">Inactif</option>
        </select>
      </div>
    </div>

    <footer class="create-panel__actions">
      <button type="button" class="btn btn--ghost" (click)="onCancel()" [disabled]="saving()">
        Annuler
      </button>
      <button type="submit" class="btn btn--primary" [disabled]="saving() || loading()">
        <span class="material-symbols-outlined" aria-hidden="true">save</span>
        {{ saving() ? 'Enregistrement…' : (isEditMode() ? 'Enregistrer les modifications' : 'Enregistrer l’enseignant') }}
      </button>
    </footer>
  </form>
</section>
