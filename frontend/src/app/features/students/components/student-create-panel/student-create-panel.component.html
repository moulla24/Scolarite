<section class="create-panel" aria-labelledby="create-student-title">
  <header class="create-panel__header">
    <div class="create-panel__title-row">
      <span class="material-symbols-outlined create-panel__icon" aria-hidden="true">person_add</span>
      <div>
        <h2 id="create-student-title" class="create-panel__title">
          {{ isEditMode() ? 'Modifier l’élève' : 'Nouvel élève' }}
        </h2>
        <p class="create-panel__subtitle">
          {{ isEditMode() ? 'Mettez à jour les informations de l’élève' : 'Inscrivez l’élève puis affectez-le à un parent depuis la fiche parent' }}
        </p>
      </div>
    </div>
    <button
      type="button"
      class="create-panel__close"
      aria-label="Fermer le formulaire"
      (click)="onCancel()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">close</span>
    </button>
  </header>

  @if (loading()) {
    <p class="create-panel__subtitle">Chargement…</p>
  }

  @if (errorMessage(); as err) {
    <div class="create-panel__alert" role="alert">{{ err }}</div>
  }

  <form class="create-panel__form" (ngSubmit)="onSubmit()">
    <div class="create-panel__grid">
      <div class="form-field">
        <label class="form-field__label" for="stu-matricule">Matricule *</label>
        <input
          id="stu-matricule"
          class="form-field__input"
          type="text"
          placeholder="MAT-2025-001"
          [ngModel]="form().matricule"
          (ngModelChange)="patchField('matricule', $event)"
          name="matricule"
          required
        />
      </div>

      <div class="form-field">
        <label class="form-field__label" for="stu-sexe">Sexe</label>
        <select
          id="stu-sexe"
          class="form-field__input"
          [ngModel]="form().sexe"
          (ngModelChange)="patchField('sexe', $event)"
          name="sexe"
        >
          <option value="">—</option>
          <option value="M">Masculin</option>
          <option value="F">Féminin</option>
        </select>
      </div>

      <div class="form-field">
        <label class="form-field__label" for="stu-nom">Nom *</label>
        <input
          id="stu-nom"
          class="form-field__input"
          type="text"
          [ngModel]="form().nom"
          (ngModelChange)="patchField('nom', $event)"
          name="nom"
          required
        />
      </div>

      <div class="form-field">
        <label class="form-field__label" for="stu-prenom">Prénom *</label>
        <input
          id="stu-prenom"
          class="form-field__input"
          type="text"
          [ngModel]="form().prenom"
          (ngModelChange)="patchField('prenom', $event)"
          name="prenom"
          required
        />
      </div>

      <div class="form-field">
        <label class="form-field__label" for="stu-naissance">Date de naissance</label>
        <input
          id="stu-naissance"
          class="form-field__input"
          type="date"
          [ngModel]="form().dateNaissance"
          (ngModelChange)="patchField('dateNaissance', $event)"
          name="dateNaissance"
        />
      </div>

      <div class="form-field">
        <label class="form-field__label" for="stu-niveau">Niveau *</label>
        <select
          id="stu-niveau"
          class="form-field__input"
          [ngModel]="form().niveauId"
          (ngModelChange)="onNiveauChange($event)"
          name="niveauId"
          required
        >
          <option value="all">Choisir un niveau…</option>
          @for (opt of levelFilters(); track opt.id) {
            @if (opt.id !== 'all') {
              <option [value]="opt.id">{{ opt.label }}</option>
            }
          }
        </select>
      </div>

      <div class="form-field">
        <label class="form-field__label" for="stu-classe">Classe *</label>
        <select
          id="stu-classe"
          class="form-field__input"
          [ngModel]="form().classeId"
          (ngModelChange)="patchField('classeId', $event)"
          name="classeId"
          [disabled]="form().niveauId === 'all'"
          required
        >
          <option value="">Choisir une classe…</option>
          @for (c of classOptions(); track c.id) {
            <option [value]="c.id">{{ c.label }}</option>
          }
        </select>
      </div>
    </div>

    <footer class="create-panel__actions">
      <button type="button" class="btn btn--ghost" (click)="onCancel()" [disabled]="saving()">
        Annuler
      </button>
      <button type="submit" class="btn btn--primary" [disabled]="saving() || loading()">
        <span class="material-symbols-outlined" aria-hidden="true">save</span>
        {{ saving() ? 'Enregistrement…' : (isEditMode() ? 'Enregistrer les modifications' : 'Enregistrer l’élève') }}
      </button>
    </footer>
  </form>
</section>
